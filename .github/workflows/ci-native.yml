name: CI Native Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04

    env:
      FLASK_APP: manage.py
      FLASK_ENV: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize SQLite database
        run: |
          flask db upgrade

      - name: Smoke test Flask server
        run: |
          flask run --host=127.0.0.1 --port=5000 &
          SERVER_PID=$!
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/)
          echo "HTTP response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 302 ]; then
            echo "Smoke test failed: server returned $HTTP_CODE"
            kill $SERVER_PID
            exit 1
          fi
          echo "Smoke test passed!"
          kill $SERVER_PID