name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Validate code
        run: |
          python -m compileall -q manage.py application
          echo "Syntax validation passed"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "Flask==1.1.2" "Werkzeug==1.0.1" \
            "Jinja2==2.11.3" "MarkupSafe==1.1.1" \
            "itsdangerous==1.1.0" "click==7.1.2" \
            "Flask-Script==2.0.6" "Flask-SQLAlchemy==2.4.4" \
            "Flask-Migrate==2.5.3" "Flask-Babel==1.0.0" \
            "SQLAlchemy==1.3.24" "alembic==1.4.3" "Babel==2.9.1"

      - name: Initialize SQLite database
        run: python manage.py db upgrade

      - name: Smoke test Flask server
        run: |
          python manage.py runserver > server.log 2>&1 &
          SERVER_PID=$!
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:7345/)
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "Flask server is up and responding"
          else
            echo "Flask server did not respond correctly"
            cat server.log
            exit 1
          fi
          kill $SERVER_PID
